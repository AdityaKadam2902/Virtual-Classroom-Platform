{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary opacity-25 mb-2">{{ code }}</div>
    <h1 class="h3 fw-bold mb-2">{{ title }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-house me-1"></i>Back to Home
    </a>
  </div>
</div>
{% endblock %}
